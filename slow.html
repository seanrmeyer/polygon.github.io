function loadImg(src) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; });
}
function tinted(src, tint) {   // AS2 setRGB: per-channel multiply
  const c = document.createElement('canvas');
  c.width = src.naturalWidth; c.height = src.naturalHeight;
  const cx = c.getContext('2d');
  cx.drawImage(src, 0, 0);
  const id = cx.getImageData(0, 0, c.width, c.height), d = id.data;
  const tr = (tint >> 16 & 255) / 255, tg = (tint >> 8 & 255) / 255, tb = (tint & 255) / 255;
  for (let i = 0; i < d.length; i += 4) { d[i] *= tr; d[i+1] *= tg; d[i+2] *= tb; }
  cx.putImageData(id, 0, 0);
  return c;
}
function drawSprite(img, x, y, rotDeg, scalePct) {   // Flash: center registration, % scale
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotDeg * D2R);
  const s = scalePct / 100;
  ctx.scale(s, s);
  ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
  ctx.restore();
}

/* ================= SeasonSwarm (DefineSprite_22) ================= */
class SeasonSwarm {
  constructor(p) { Object.assign(this, p); this.init(); }
  init() {
    const myColors = ["6bcee8","161622","19161e","211c1e","241d1f","251418","6c0c09","8b0805",
      "990000","ad0402","bf0603","cc0000","ebbb60","f59503","f7b631","fcb802","fcd14c","fea503",
      "fec602","fed230","feec71","fef88c"];
    this.colorList = myColors.map(hex => {
      const baseColor = parseInt(hex, 16);
      const goalRed = this.endColor >> 16, goalGreen = this.endColor >> 8 & 0xFF, goalBlue = this.endColor & 0xFF;
      const baseRed = baseColor >> 16, baseGreen = baseColor >> 8 & 0xFF, baseBlue = baseColor & 0xFF;
      const stepRed = Math.round((goalRed - baseRed) / (this.swarmTailSize - 1));
      const stepGreen = Math.round((goalGreen - baseGreen) / (this.swarmTailSize - 1));
      const stepBlue = Math.round((goalBlue - baseBlue) / (this.swarmTailSize - 1));
      const grad = new Array(this.swarmTailSize);
      grad[0] = baseColor;
      for (let j = 1; j < this.swarmTailSize - 1; j++)
        grad[j] = constrain(baseRed + stepRed * j, 0, 255) << 16 |
                  constrain(baseGreen + stepGreen * j, 0, 255) << 8 |
                  constrain(baseBlue + stepBlue * j, 0, 255);
      grad[this.swarmTailSize - 1] = goalRed << 16 | goalGreen << 8 | goalBlue;
      return grad;
    });
    this.leaderTime = this.leaderRunTime;
    this.leaderX = Math.random() * W;
    this.leaderY = Math.random() * H;
    this.leaderRot = Math.random() * TWO_PI;
    this.leaderRotSpeed = this.leaderRotSpeed * D2R;
    this.swarmRotSpeed = this.swarmRotSpeed * D2R;
    this.swarmTwitch = this.swarmTwitch * D2R;
    this.swarmList = [];
    for (let i = 0; i < this.numSwarm; i++) {
      const swarm = { rot: Math.random() * TWO_PI, posList: [] };
      swarm.colorIndex = (i == 0) ? 0 : rand(this.colorList.length);
      swarm.isSkinny = rand(3) == 0;
      swarm.maxThick = rand(20) + 20;
      const x = Math.random() * W, y = Math.random() * H;   // AS2 random(n) float here
      for (let j = 0; j < this.swarmTailSize; j++) swarm.posList.push({ x, y });
      this.swarmList.push(swarm);
    }
  }
  drawFrame(k) {
    if (this.leaderTime <= 0) {
      this.goalX = Math.random() * W;
      this.goalY = Math.random() * H;
      this.leaderTime = this.leaderRunTime;
    }
    /* leader: turns at fixed rate toward a random goal re-picked every leaderRunTime frames.
       Constant turn rate + constant speed => circular arcs (r = speed/omega): the "spiral". */
    let goalAngle = Math.atan2(this.goalY - this.leaderY, this.goalX - this.leaderX); // NaN while goal unset (first 20 frames)
    goalAngle = fixAngle(goalAngle - this.leaderRot);
    if (goalAngle < Math.PI) this.leaderRot += this.leaderRotSpeed * k;
    else this.leaderRot -= this.leaderRotSpeed * k;
    this.leaderX += Math.cos(this.leaderRot) * this.leaderSpeed * k;
    this.leaderY += Math.sin(this.leaderRot) * this.leaderSpeed * k;
    this.leaderTime -= k;

    for (let i = 0; i < this.numSwarm; i++) {
      const swarm = this.swarmList[i];
      const swarmColor = this.colorList[swarm.colorIndex];
      const x0 = swarm.posList[0].x, y0 = swarm.posList[0].y;
      let a = Math.atan2(this.leaderY - y0, this.leaderX - x0);
      a = fixAngle(a - swarm.rot);
      if (a < Math.PI) swarm.rot += this.swarmRotSpeed * k;
      else swarm.rot -= this.swarmRotSpeed * k;
      swarm.rot += (Math.random() * this.swarmTwitch - Math.floor(this.swarmTwitch / 2)) * k; // [0,40deg) positive bias, time-scaled
      const x = x0 + Math.cos(swarm.rot) * this.swarmSpeed * k;
      const y = y0 + Math.sin(swarm.rot) * this.swarmSpeed * k;
      swarm.posList.pop();
      swarm.posList.unshift({ x, y });

      /* draw trail (inverse branch, as in SWF): tail->head, width peaks mid-trail,
         color fades base(head) -> endColor 0x000024 (tail) */
      const midPoint = Math.floor(this.swarmTailSize / 2);
      const thickStep = swarm.maxThick / midPoint;
      let prev = swarm.posList[this.swarmTailSize - 1];
      for (let j = this.swarmTailSize - 2; j > -1; j--) {
        const pt = swarm.posList[j];
        let w = swarm.isSkinny ? 0 : thickStep * (midPoint - 2 - Math.abs(j - midPoint));
        w = w > 0 ? w : 1;                                   // Flash hairline for width<=0
        ctx.strokeStyle = '#' + (swarmColor[j] >>> 0).toString(16).padStart(6, '0');
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
        prev = pt;
      }
    }
  }
}

/* ================= Random_Fireflies (DefineSprite_23) ================= */
class RandomFireflies {
  constructor(p) { Object.assign(this, p); this.init(); }
  init() {
    const max = this.assetList.length;
    const halfRotRange = this.rotRange / 2;
    const scaleRange = this.maxScale - this.minScale;
    const alphaRange = this.maxAlpha - this.minAlpha;
    this.items = [];
    for (let i = 0; i < this.numElements; i++) {
      /* hidden marker: jittering random walk, bounce at edges */
      const marker = { x: Math.random() * W, y: Math.random() * H };
      /* asset sprite: exponentially chases its marker (assetFriction) */
      const clip = {
        name: this.assetList[rand(max)],
        x: marker.x, y: marker.y,
        rot: rand(this.rotRange) - halfRotRange + this.baseRot,
        scale: rand(scaleRange) + this.minScale,
        alpha: rand(alphaRange) + this.minAlpha,
        marker,
      };
      if (this.useColorArray)
        clip.tint = [0x191919, 0x212121, 0x242424, 0x333333, 0x4d4d4d][rand(5)];
      this.items.push(clip);
    }
  }
  drawFrame(k) {
    const fric = 1 - Math.pow(1 - this.assetFriction, k);   // time-corrected exponential chase
    for (const clip of this.items) {
      const m = clip.marker, randomMove = this.assetVibration;
      let xPos = (Math.random() * randomMove - randomMove / 2) * k;
      let yPos = (Math.random() * randomMove - randomMove / 2) * k;
      if (xPos >= 0) xPos += k;
      if (yPos >= 0) yPos += k;
      if (m.x <= 0) xPos = Math.random() * randomMove * k;
      else if (m.x >= W) xPos = -Math.random() * randomMove * k;
      if (m.y <= 0) yPos = Math.random() * randomMove * k;
      else if (m.y >= H) yPos = -Math.random() * randomMove * k;
      m.x += xPos; m.y += yPos;
      clip.x -= (clip.x - m.x) * fric;
      clip.y -= (clip.y - m.y) * fric;
      ctx.globalAlpha = clip.alpha / 100;
      drawSprite(clip.sprite, clip.x, clip.y, clip.rot, clip.scale);
      ctx.globalAlpha = 1;
    }
  }
}

/* ================= Random_Wireframe (DefineSprite_24) — static scatter ================= */
class RandomWireframe {
  constructor(p) { Object.assign(this, p); this.init(); }
  init() {
    const max = this.outlineList.length;
    const halfRotRange = this.rotRange / 2;
    const scaleRange = this.maxScale - this.minScale;
    const alphaRange = this.maxAlpha - this.minAlpha;
    this.myColors = [0x111111,0x151515,0x191919,0x111111,0x151515,0x191919,
                     0x111111,0x151515,0x191919,0x242424,0x161622];
    this.items = [];
    for (let i = 0; i < this.numElements; i++) {
      const num = rand(max);
      this.items.push({
        out: this.outlineList[num], fill: this.fillList[num],
        x: Math.random() * W, y: Math.random() * H,
        rot: rand(this.rotRange) - halfRotRange + this.baseRot,
        scale: rand(scaleRange) + this.minScale,
        alpha: rand(alphaRange) + this.minAlpha,
        tint: this.myColors[rand(this.myColors.length)],
      });
    }
  }
  draw(sprites) {
    for (const it of this.items) {
      ctx.globalAlpha = it.alpha / 100;
      drawSprite(sprites[it.out], it.x, it.y, it.rot, it.scale);      // black wireframe (own alpha)
      drawSprite(tintCache[it.fill + it.tint] ||= tinted(sprites[it.fill], it.tint), it.x, it.y, it.rot, it.scale);
      ctx.globalAlpha = 1;
    }
  }
}
const tintCache = {};

/* ---------- instances (params from on(initialize) in the SWF) ---------- */
const swarm = new SeasonSwarm({
  leaderRotSpeed: 40, leaderRunTime: 20, leaderSpeed: 15, numSwarm: 23,
  swarmTwitch: 40, swarmRotSpeed: 40, swarmSpeed: 20, swarmTailSize: 20,
  endColor: 0x24, inverse: true,
});
const firefliesA = new RandomFireflies({ numElements: 10, assetList: ['firefly'], baseRot: 0, rotRange: 360,
  minScale: 20, maxScale: 40, minAlpha: 100, maxAlpha: 100, assetVibration: 20, assetFriction: 0.1, useColorArray: true });
const firefliesB = new RandomFireflies({ numElements: 10, assetList: ['firefly'], baseRot: 0, rotRange: 360,
  minScale: 20, maxScale: 40, minAlpha: 100, maxAlpha: 100, assetVibration: 20, assetFriction: 0.1, useColorArray: true });
const firefliesC = new RandomFireflies({ numElements: 4, assetList: ['firefly'], baseRot: 0, rotRange: 360,
  minScale: 5, maxScale: 20, minAlpha: 100, maxAlpha: 100, assetVibration: 20, assetFriction: 0.1, useColorArray: true });
const ember = new RandomFireflies({ numElements: 1, assetList: ['firebtn'], baseRot: 0, rotRange: 0,
  minScale: 15, maxScale: 15, minAlpha: 100, maxAlpha: 100, assetVibration: 20, assetFriction: 0.05, useColorArray: false });
const wireBig = new RandomWireframe({ numElements: 5, outlineList: ['out01', 'out02'], fillList: ['in01', 'in02'],
  baseRot: 0, rotRange: 360, minScale: 200, maxScale: 300, minAlpha: 100, maxAlpha: 100 });
const wireSmall = new RandomWireframe({ numElements: 25, outlineList: ['out01', 'out02'], fillList: ['in01', 'in02'],
  baseRot: 0, rotRange: 360, minScale: 100, maxScale: 250, minAlpha: 100, maxAlpha: 100 });

/* ---------- main loop: render at native refresh, sim time-scaled from 31fps base ---------- */
const FPS_BASE = 31;   // SWF native fps — the time base all per-frame velocities were authored at
const SLOW = 0.5;      // playback speed (1 = original, 0.5 = half speed)
let sprites, last = 0;
Promise.all(Object.entries(B64).map(([k, v]) => loadImg(v).then(img => [k, img])))
  .then(pairs => {
    sprites = Object.fromEntries(pairs);
    /* pre-tint firefly sprites once per color */
    for (const t of [0x191919, 0x212121, 0x242424, 0x333333, 0x4d4d4d])
      sprites['firefly_' + t.toString(16)] = tinted(sprites.firefly, t);
    for (const ff of [firefliesA, firefliesB, firefliesC])
      for (const c of ff.items) c.sprite = sprites['firefly_' + c.tint.toString(16)];
    ember.items[0].sprite = sprites.firebtn;
    requestAnimationFrame(tick);
  });
function tick(now) {
  requestAnimationFrame(tick);
  if (!last) { last = now; return; }
  const dt = Math.min((now - last) / 1000, 0.1);   // seconds, clamped after tab switches
  last = now;
  const k = dt * FPS_BASE * SLOW;                  // sim steps this frame (0.5x at 31fps => 0.5)
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  wireBig.draw(sprites);        // static layer, drawn once per frame (SWF: static clips)
  wireSmall.draw(sprites);
  swarm.drawFrame(k);           // clears its own area in Flash; here trails only
  firefliesA.drawFrame(k);
  firefliesB.drawFrame(k);
  firefliesC.drawFrame(k);
  ember.drawFrame(k);
}
</script>
